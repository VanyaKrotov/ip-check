name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build app
        run: npm run build

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Prepare release bundle
        run: |
          mkdir -p release/ip-check
          cp Dockerfile release/ip-check/Dockerfile
          cp deploy/docker-compose.yml release/ip-check/docker-compose.yml
          cp deploy/README.md release/ip-check/README.md
          sed -i "s#ghcr.io/OWNER/REPOSITORY:latest#${IMAGE_NAME}:${GITHUB_REF_NAME}#g" release/ip-check/docker-compose.yml
          tar -czf ip-check-release-${GITHUB_REF_NAME}.tar.gz -C release ip-check

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ip-check-release-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
